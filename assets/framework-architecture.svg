<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">CryptoSHIELD responsibility map</title>
<desc id="desc">CryptoSHIELD specifies financial authority controls. AI SAFE2 and Cognitive Sovereignty are companion references with mappings pending verification. Specifications are not deployed protections.</desc>
<rect width="960" height="420" rx="12" fill="#202124"/>
<g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
<text x="480" y="44" fill="#f6921e" font-size="25">CSI CryptoSHIELD</text>
<rect x="40" y="70" width="880" height="120" rx="10" fill="#303134" stroke="#f6921e"/>
<text x="480" y="105" fill="#ffffff" font-size="21">Financial authority and asset-specific controls</text>
<text x="480" y="137" fill="#ffffff" font-size="17">44 threats / 12 categories / 95 operational + 5 governance controls</text>
<text x="480" y="168" fill="#f6921e" font-size="16">Wallets, devices, physical exposure, platforms, chains, supply, agents, governance, fraud</text>
<rect x="40" y="220" width="420" height="110" rx="10" fill="#303134" stroke="#808080"/>
<rect x="500" y="220" width="420" height="110" rx="10" fill="#303134" stroke="#808080"/>
<text x="250" y="252" fill="#f6921e" font-size="21">AI SAFE²</text>
<text x="250" y="282" fill="#ffffff" font-size="17">Agent governance reference</text>
<text x="250" y="308" fill="#ffffff" font-size="15">Exact mappings pending verification</text>
<text x="710" y="252" fill="#f6921e" font-size="21">Cognitive Sovereignty</text>
<text x="710" y="282" fill="#ffffff" font-size="17">Human decision autonomy reference</text>
<text x="710" y="308" fill="#ffffff" font-size="15">Exact mappings pending verification</text>
<text x="480" y="367" fill="#ffffff" font-size="18">Specifications require implementation and scenario-specific evidence.</text>
<text x="480" y="396" fill="#f6921e" font-size="17">CTRS suspended / Physical safety first / No universal prevention guarantee</text>
</g></svg>
