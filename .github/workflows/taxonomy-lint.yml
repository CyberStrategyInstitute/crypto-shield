name: Repository Integrity

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install -r requirements-validation.txt
      - name: Validate data and documentation contracts
        run: python tools/validate_repository.py
      - name: Check acceptance and rejection fixtures
        run: python -m unittest discover -s tests -v
